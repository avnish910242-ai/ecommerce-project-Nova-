<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Status - NOVA</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
            color: #111;
        }


        header {
            background: #111;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        header h1 {
            font-size: 22px;
        }


        .back-btn {
            background: white;
            color: #111;

            border: none;
            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;
        }


        .container {
            max-width: 800px;

            margin: 30px auto;

            padding: 0 15px;
        }


        .box {
            background: white;

            padding: 22px;

            border-radius: 15px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .current-status {
            text-align: center;

            padding: 20px;

            border-radius: 15px;

            background: #fff3cd;

            margin-bottom: 25px;
        }


        .current-status h2 {
            margin-bottom: 8px;
        }


        .timeline {
            margin-top: 20px;
        }


        .step {
            display: flex;

            gap: 15px;

            position: relative;

            padding-bottom: 25px;
        }


        .circle {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: #ddd;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            font-size: 18px;
        }


        .step.active .circle {
            background: #111;
            color: white;
        }


        .step.completed .circle {
            background: #198754;
            color: white;
        }


        .step-content h3 {
            margin-bottom: 5px;
        }


        .step-content p {
            color: #666;
        }


        .line {
            position: absolute;

            left: 19px;
            top: 40px;

            width: 2px;
            height: 45px;

            background: #ddd;
        }


        .completed .line {
            background: #198754;
        }


        .product {
            display: flex;

            gap: 15px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }


        .product img {
            width: 70px;
            height: 70px;

            object-fit: cover;

            border-radius: 10px;
        }


        .address {
            background: #f7f7f7;

            padding: 15px;

            border-radius: 10px;

            margin-top: 10px;
        }


        .loading {
            text-align: center;

            padding: 50px;

            font-size: 18px;
        }


    </style>

</head>


<body>


<header>

    <h1>📦 Order Status</h1>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Orders
    </button>

</header>



<div class="container">


    <div id="content">

        <div class="loading">
            ⏳ Loading order...
        </div>

    </div>


</div>



<script>

const API_URL =
    "https://nova-backend-7i1l.onrender.com";


// ==========================================
// GET ORDER ID FROM URL
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const orderId =
    params.get("id");


// ==========================================
// LOAD ORDER
// ==========================================

async function loadOrder() {

    if (!orderId) {

        document.getElementById("content").innerHTML = `

            <div class="box">

                <h2>
                    ❌ Order ID missing
                </h2>

                <p style="margin-top:10px;">
                    Order nahi mila.
                </p>

            </div>

        `;

        return;
    }


    try {

      const response = await fetch(
    "https://nova-backend-7i1l.onrender.com/api/orders/" +
    encodeURIComponent(orderId)
);


        const order =
            await response.json();


        if (!response.ok) {

            throw new Error(
                order.message ||
                "Order not found"
            );

        }


        showOrder(order);


    } catch (error) {

        console.error(error);


        document.getElementById("content").innerHTML = `

            <div class="box">

                <h2>
                    ❌ Order is not loading.
                </h2>

                <p style="margin-top:10px;">
                    Backend server check karo.
                </p>

            </div>

        `;

    }

}


// ==========================================
// SHOW ORDER
// ==========================================

function showOrder(order) {


    let statusEmoji = "🟡";


    if (order.status === "Confirmed") {
        statusEmoji = "🔵";
    }

    else if (order.status === "Shipped") {
        statusEmoji = "🚚";
    }

    else if (order.status === "Delivered") {
        statusEmoji = "🟢";
    }

    else if (order.status === "Cancelled") {
        statusEmoji = "🔴";
    }


    // ======================================
    // STATUS STEPS
    // ======================================

    const steps = [

        {
            name: "Pending",
            emoji: "🟡",
            text: "Order received"
        },

        {
            name: "Confirmed",
            emoji: "🔵",
            text: "Seller confirmed your order"
        },

        {
            name: "Shipped",
            emoji: "🚚",
            text: "Order has been shipped"
        },

        {
            name: "Delivered",
            emoji: "🟢",
            text: "Order delivered"
        }

    ];


    const statusOrder = [
        "Pending",
        "Confirmed",
        "Shipped",
        "Delivered"
    ];


    let currentIndex =
        statusOrder.indexOf(
            order.status
        );


    let timelineHTML = "";


    steps.forEach(function(step, index) {


        let className = "";


        if (
            order.status !== "Cancelled" &&
            index < currentIndex
        ) {

            className = "completed";

        }

        else if (
            order.status !== "Cancelled" &&
            index === currentIndex
        ) {

            className = "active";

        }


        timelineHTML += `

            <div class="step ${className}">

                <div class="circle">

                    ${step.emoji}

                </div>


                <div class="step-content">

                    <h3>
                        ${step.name}
                    </h3>

                    <p>
                        ${step.text}
                    </p>

                </div>


                ${
                    index < steps.length - 1
                    ?
                    `<div class="line"></div>`
                    :
                    ""
                }

            </div>

        `;

    });


    // ======================================
    // CANCELLED
    // ======================================

    if (order.status === "Cancelled") {

        timelineHTML = `

            <div class="current-status">

                <h2>
                    🔴 Order Cancelled
                </h2>

                <p>
                    This order has been cancelled.
                </p>

            </div>

        `;

    }


    // ======================================
    // PRODUCTS
    // ======================================

    let productsHTML = "";


    order.items.forEach(function(item) {


        let imageURL = "";


        if (item.image) {

            if (
                item.image.startsWith("http")
            ) {

                imageURL = item.image;

            }

            else {

                imageURL =
                    API_URL +
                    item.image;

            }

        }


        productsHTML += `

            <div class="product">

                ${
                    imageURL
                    ?
                    `
                    <img
                        src="${imageURL}"
                        alt="${item.name}"
                    >
                    `
                    :
                    `
                    <div
                        style="
                            width:70px;
                            height:70px;
                            background:#eee;
                            border-radius:10px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:25px;
                        "
                    >
                        📦
                    </div>
                    `
                }


                <div>

                    <h3>
                        ${item.name}
                    </h3>

                    <p style="margin-top:6px;">
                        Quantity:
                        ${item.quantity}
                    </p>

                    <p style="margin-top:4px;">
                        ₹${Number(item.price)
                            .toLocaleString("en-IN")}
                    </p>

                </div>

            </div>

        `;

    });


    // ======================================
    // FINAL PAGE
    // ======================================

    document.getElementById("content").innerHTML = `

        <div class="box">

            <div class="current-status">

                <h2>
                    ${statusEmoji}
                    ${order.status}
                </h2>

                <p style="margin-top:8px;">
                    Order ID:
                    ${order._id}
                </p>

            </div>


            <h2>
                🚚 Delivery Status
            </h2>


            <div class="timeline">

                ${timelineHTML}

            </div>

        </div>



        <div class ="box";">

            <h2>
                 Order Details
            </h2>


            ${productsHTML}


            <h2 style="margin-top:20px;">

                Total:
                ₹${Number(order.totalAmount)
                    .toLocaleString("en-IN")}

            </h2>

        </div>



        <div class="box">

            <h2>
                 Delivery Information
            </h2>


            <div class="address">

                <p>
                    <strong>
                        Address:
                    </strong>
                </p>

                <p style="margin-top:8px;">
                    ${order.address}
                </p>


                <p style="margin-top:12px;">
                    📞 ${order.phone}
                </p>

            </div>

        </div>

    `;

}


// ==========================================
// BACK
// ==========================================

function goBack() {

    window.location.href =
        "orders.html";

}


// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadOrder();

    }
);

</script>


</body>

</html>
