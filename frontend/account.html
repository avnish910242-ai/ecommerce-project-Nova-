<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA — Account</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           ACCOUNT BOX
        ========================= */

        .account-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }


        /* =========================
           TITLE
        ========================= */

        .account-box h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }


        /* =========================
           TABS
        ========================= */

        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
        }

        .tab.active {
            color: #111;
            border-bottom: 2px solid #111;
        }


        /* =========================
           FORM
        ========================= */

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 13px 42px 13px 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #111;
        }


        /* =========================
           PASSWORD
        ========================= */

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 17px;
        }


        /* =========================
           BUTTON
        ========================= */

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #333;
        }


        /* =========================
           PROFILE
        ========================= */

        #profileSection {
            display: none;
        }

        .profile-box {
            background: #f5f5f5;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 18px;
        }

        .profile-box h2 {
            font-size: 21px;
        }

        .profile-email {
            margin-top: 8px;
            color: #555;
            font-size: 14px;
        }


        /* =========================
           LOGOUT
        ========================= */

        .logout-btn {
            display: block;
            width: 120px;
            margin: 0 auto;
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: red;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f5f5f5;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }


        /* =========================
           BACK HOME
        ========================= */

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #111;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .account-box {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="account-box">

    <h1>My Account</h1>

    <p class="subtitle">
        Sign in or create a new account
    </p>


    <!-- =========================
         PROFILE
    ========================= -->

    <div id="profileSection">

        <div class="profile-box">

            <h2 id="profileName">
                User
            </h2>

            <p class="profile-email">
                📧 <strong>Email:</strong>
                <span id="profileEmail"></span>
            </p>

        </div>


        <button
            type="button"
            class="logout-btn"
            onclick="logoutAccount()"
        >
            Logout
        </button>

    </div>


    <!-- =========================
         TABS
    ========================= -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="showForm('login', this)"
        >
            Login
        </button>

        <button
            class="tab"
            onclick="showForm('register', this)"
        >
            Create Account
        </button>

    </div>


    <!-- =========================
         LOGIN
    ========================= -->

    <form
        id="loginForm"
        class="form active"
    >

        <div class="input-group">

            <label>Email</label>

            <div class="input-box">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('loginPassword', this)"
                >
                    👁️
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="submit-btn"
        >
            Login
        </button>

    </form>


    <!-- =========================
         CREATE ACCOUNT
    ========================= -->

    <form
        id="registerForm"
        class="form"
    >

        <div class="input-group">

            <label>Full Name</label>

            <div class="input-box">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>Email</label>

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('password', this)"
                >
                    👁️
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="submit-btn"
        >
            Create Account
        </button>

    </form>


    <!-- MESSAGE -->

    <p
        id="accountMessage"
        class="message"
    ></p>


    <!-- BACK HOME -->

    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Home
    </a>


</div>


<script src="login.js"></script>

</body>

</html>
