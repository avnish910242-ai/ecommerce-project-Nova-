<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - NOVA</title>
<link rel="stylesheet" href="login.css?v=2">
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div class="account-icon">  
        <svg

    viewBox="0 0 24 24"
    width="20"
    height="20"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">

    <circle cx="12" cy="8" r="3"></circle>

    <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>

</svg></div>
    <p class="welcome">Sign in your accout</p>
<div id="googleSignInButton"></div>

<div
    id="loggedInGoogleAccount"
    style="display:none;"
>
    <span>G</span>
    <span id="loggedInGoogleEmail"></span>
</div>

    <div class="divider"><span>or</span></div>
    <p class="new-user">New to <span style ="color:blue;"> SEASHOP </span>?</p>
<button
    class="create-btn"
    type="button"
    onclick="window.location.href='account.html'">
    Create an account
</button>
<button
        class="logout-btn"
        type="button"
        onclick="logoutAccount()">
        Logout
    </button>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="login.js"></script>
<script src="firebase.js"></script>
</body>
</html>
