<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <!-- Water drop gradient -->
    <radialGradient id="blue" cx="28%" cy="18%" r="88%">
      <stop offset="0" stop-color="#62D9FF"/>
      <stop offset=".35" stop-color="#159CFF"/>
      <stop offset=".72" stop-color="#0870E8"/>
      <stop offset="1" stop-color="#003EBB"/>
     
    </radialGradient>

    <!-- White cart gradient -->
    <linearGradient id="cartWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0000ff"/>
      <stop offset=".55" stop-color="#0000ff"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>

    <!-- Shadow -->
    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%">

      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="6"
        flood-color="#003B9B"
        flood-opacity=".30"/>

    </filter>

  </defs>


  <!-- ========================= -->
  <!-- WATER DROPS -->
  <!-- ========================= -->

  <g
    fill="url(#blue)"
    filter="url(#shadow)">

    <g transform="translate(256 256)">

      <path
        id="drop"
        d="
          M0-244
          C-15-221-27-205-27-187
          A27 27 0 0 0 27-187
          C27-205 15-221 0-244Z
        "
      />

      <use href="#drop" transform="rotate(30)"/>
      <use href="#drop" transform="rotate(60)"/>
      <use href="#drop" transform="rotate(90)"/>
      <use href="#drop" transform="rotate(120)"/>
      <use href="#drop" transform="rotate(150)"/>
      <use href="#drop" transform="rotate(180)"/>
      <use href="#drop" transform="rotate(210)"/>
      <use href="#drop" transform="rotate(240)"/>
      <use href="#drop" transform="rotate(270)"/>
      <use href="#drop" transform="rotate(300)"/>
      <use href="#drop" transform="rotate(330)"/>

    </g>

  </g>


  <!-- ========================= -->
  <!-- CENTER WHITE CART -->
  <!-- ========================= -->

  <g
    transform="
      translate(67 67)
      scale(.735)
    ">


    <!-- White cart outline -->

    <g
      fill="none"
      stroke="url(#cartWhite)"
      stroke-width="19"
      stroke-linecap="round"
      stroke-linejoin="round">

      <!-- Handle + frame -->

      <path
        d="
          M151 202
          H181
          L204 318
          Q207 331 220 331
          H355
        "
      />

      <!-- Basket -->

      <path
        d="
          M195 226
          H388
          L366 302
          H210
        "
      />

      <!-- Lower support -->

      <path
        d="
          M224 350
          H353
        "
      />

    </g>


    <!-- White basket -->


    <!-- Light gray basket shine -->


    <!-- Left wheel -->

    <circle
      cx="244"
      cy="369"
      r="17"
      fill="#0000ff"
    />

    <circle
      cx="244"
      cy="369"
      r="7"
      fill="#0000ff"
    />


    <!-- Right wheel -->

    <circle
      cx="342"
      cy="369"
      r="17"
      fill="#0000ff"
    />

    <circle
      cx="342"
      cy="369"
      r="7"
      fill="#0000ff"
    />


    <!-- White handle end -->

    <circle
      cx="151"
      cy="202"
      r="10"
      fill="#0000ff"
    />

  </g>

</svg>