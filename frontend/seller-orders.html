<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 22px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .order {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .order h2 {
            margin-top: 0;
        }

        .product {
            display: flex;
            gap: 15px;
            align-items: center;
            margin: 15px 0;
            padding: 12px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .product img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .status {
            font-weight: bold;
            margin: 15px 0;
        }

        .pending {
            color: #d98c00;
        }

        .confirmed {
            color: #1769aa;
        }

        .shipped {
            color: #e65100;
        }

        .delivered {
            color: green;
        }

        .cancelled {
            color: red;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .accept-btn {
            background: #111;
            color: white;
        }

        .accept-btn:hover {
            background: #333;
        }

        .message {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }

        .back-btn {
            background: #ddd;
            color: #111;
            margin-bottom: 20px;
        }

        .status-select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

    </style>

</head>


<body>

<header>
    📦 Seller Orders
</header>


<div class="container">

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Back to Dashboard
    </button>


    <div id="ordersContainer">

        <div class="message">
            Loading orders...
        </div>

    </div>

</div>



<script>

const API_URL =
    "https://nova-backend-7i1l.onrender.com";


// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    try {
        const savedUser =
    localStorage.getItem("novaUser");

const user =
    savedUser
        ? JSON.parse(savedUser)
        : null;

if (!user || !user.email) {

    document.getElementById(
        "ordersContainer"
    ).innerHTML = `
        <div class="message">
            ❌ Seller login required.
        </div>
    `;

    return;

}

const response =
    await fetch(
        API_URL +
        "/api/orders/seller/" +
        encodeURIComponent(user.email)
    );



        const orders =
            await response.json();


        if (!response.ok) {

            throw new Error(
                orders.message ||
                "Orders load failed"
            );

        }


        showOrders(orders);


    } catch (error) {

        console.error(error);

        document.getElementById(
            "ordersContainer"
        ).innerHTML = `

            <div class="message">

                ❌ Orders is not loading.

                <br><br>

                Backend server check karo.

            </div>

        `;

    }

}



// ==============================
// MY ORDERS
// ==============================

function showOrders(orders) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if (!orders.length) {

        container.innerHTML = `

            <div class="message">

                📭 No orders yet.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    orders.forEach(function(order) {

        let statusClass =
            order.status.toLowerCase();


        let statusEmoji = "🟡";


        if (order.status === "Confirmed") {
            statusEmoji = "🔵";
        }

        else if (order.status === "Shipped") {
            statusEmoji = "🚚";
        }

        else if (order.status === "Delivered") {
            statusEmoji = "🟢";
        }

        else if (order.status === "Cancelled") {
            statusEmoji = "🔴";
        }


        let productsHTML = "";


        order.items.forEach(function(item) {

            let imageURL = "";


            if (item.image) {

                imageURL =
                    item.image.startsWith("http")
                    ? item.image
                    : API_URL + item.image;

            }


            productsHTML += `

                <div class="product">

                    ${
                        imageURL
                        ?
                        `
                        <img
                            src="${imageURL}"
                            alt="${item.name}"
                        >
                        `
                        :
                        `<div style="
                            width:70px;
                            height:70px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:30px;
                        ">📦</div>`
                    }


                    <div>

                        <strong>
                            ${item.name}
                        </strong>

                        <p>
                            Quantity:
                            ${item.quantity}
                        </p>

                        <p>
                            ₹${Number(item.price)
                                .toLocaleString("en-IN")}
                        </p>

                    </div>

                </div>

            `;

        });


        let actionHTML = "";


        // ==============================
        // PENDING ORDER
        // ==============================

        if (order.status === "Pending") {

            actionHTML = `

                <button
                    class="accept-btn"
                    onclick="acceptOrder('${order._id}')"
                >
                    ✅ Accept Order
                </button>

            `;

        }


        // ==============================
        // CONFIRMED ORDER
        // ==============================

        else if (order.status === "Confirmed") {

            actionHTML = `

                <select
                    class="status-select"
                    onchange="
                        updateStatus(
                            '${order._id}',
                            this.value
                        )
                    "
                >

                    <option value="Confirmed">
                        🔵 Confirmed
                    </option>

                    <option value="Shipped">
                        🚚 Shipped
                    </option>

                    <option value="Delivered">
                        🟢 Delivered
                    </option>

                </select>

            `;

        }


        // ==============================
        // SHIPPED ORDER
        // ==============================

        else if (order.status === "Shipped") {

            actionHTML = `

                <select
                    class="status-select"
                    onchange="
                        updateStatus(
                            '${order._id}',
                            this.value
                        )
                    "
                >

                    <option value="Shipped">
                        🚚 Shipped
                    </option>

                    <option value="Delivered">
                        🟢 Delivered
                    </option>

                </select>

            `;

        }


        container.innerHTML += `

            <div class="order">

                <h2>
                    📦 Order Request
                </h2>


                <p>
                    <strong>Customer:</strong>
                    ${order.customerName}
                </p>


                <p>
                    <strong>Email:</strong>
                    ${order.customerEmail}
                </p>


                <p>
                    <strong>Phone:</strong>
                    ${order.phone}
                </p>


                <p>
                    <strong>Address:</strong>
                    ${order.address}
                </p>


                <hr>


                ${productsHTML}


                <h2>
                    Total:
                    ₹${Number(order.totalAmount)
                        .toLocaleString("en-IN")}
                </h2>


                <p class="status ${statusClass}">

                    ${statusEmoji}
                    ${order.status}

                </p>


                ${actionHTML}

            </div>

        `;

    });

}



// ==========================================
// ACCEPT ORDER
// ==========================================

async function acceptOrder(orderId) {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/orders/" +
                orderId +
                "/status",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: "Confirmed"
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.message ||
                "Order accept nahi hua"
            );

            return;

        }


        alert(
            "✅ Order accepted successfully!"
        );


        loadOrders();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Server se connection nahi hua."
        );

    }

}



// ==========================================
// UPDATE STATUS
// ==========================================

async function updateStatus(
    orderId,
    newStatus
) {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/orders/" +
                orderId +
                "/status",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: newStatus
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.message ||
                "Status update failed"
            );

            return;

        }


        alert(
            "✅ Status updated to " +
            newStatus
        );


        loadOrders();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Server connection error"
        );

    }

}



// ==========================================
// BACK
// ==========================================

function goBack() {

    window.location.href =
        "seller.html";

}



// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadOrders();

    }
);

</script>

</body>
</html>
