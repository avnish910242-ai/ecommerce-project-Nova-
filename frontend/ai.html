
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>SEASHOP AI</title>
    <link rel="stylesheet" href="ai.css">
</head>
<body>

    <header class="ai-header">
        <button id="aiBackButton" class="back-button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
        </button>

        <img src="svg/seashop.svg" alt="SEASHOP" class="header-logo">
        <strong>SEASHOP AI</strong>
    </header>

    <main class="ai-main">
        <section id="welcomeScreen" class="welcome-screen">
            <img src="svg/seashop.svg" alt="SEASHOP" class="welcome-logo">

            <h1>Welcome to SEASHOP</h1>
            <p>Your AI shopping assistant</p>

            <div class="suggestions">
                <button class="suggestion">Help me find a product</button>
                <button class="suggestion">Show me popular products</button>
                <button class="suggestion">I want to know product prices</button>
                <button class="suggestion">Help me choose a product</button>
            </div>
        </section>

        <section id="chatMessages" class="chat-messages" aria-live="polite"></section>
    </main>

    <form id="aiChatForm" class="message-form">
        <input
            type="text"
            id="aiChatInput"
            placeholder="Message SEASHOP AI"
            autocomplete="off"
            required
        >
        <button type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22l-4-9-9-4z"></path>
            </svg>
        </button>
    </form>

    <script src="ai.js" defer></script>
</body>
</html>
