
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>SEASHOP AI</title>
    <link rel="stylesheet" href="ai.css">
</head>
<body>

    <header class="ai-header">
        <button
            type="button"
            id="aiBackButton"
            class="back-button"
            aria-label="Back"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
        </button>

        <img src="svg/seashop.svg" alt="SEASHOP" class="header-logo">
        <strong>SEASHOP AI</strong>

        <div class="ai-menu-wrapper">
            <button
                type="button"
                id="aiMenuButton"
                class="ai-menu-button"
                aria-label="Chat options"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="aiOptionsMenu"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="5" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="19" r="1.5"></circle>
                </svg>
            </button>

            <div id="aiOptionsMenu" class="ai-options-menu" hidden>
                <button type="button" id="aiNewChatButton">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"></path>
                        <path d="M8 9h6M8 13h4M16 19h6M19 16v6"></path>
                    </svg>
                    <span>New Chat</span>
                </button>

                <button type="button" id="aiClearChatButton" class="ai-clear-chat">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path>
                        <path d="M10 10v6M14 10v6"></path>
                    </svg>
                    <span>Clear Chat</span>
                </button>
            </div>
        </div>
    </header>

    <main class="ai-main">
        <section id="welcomeScreen" class="welcome-screen">
            <img src="svg/seashop.svg" alt="SEASHOP" class="welcome-logo">

            <h1>Welcome to SEASHOP</h1>
            <p>Your AI shopping assistant</p>

           
<div class="suggestions">
    <button type="button" class="suggestion" data-ai-suggestion="Help me find a product">
        Help me find a product
    </button>

    <button type="button" class="suggestion" data-ai-suggestion="Show me popular products">
        Show me popular products
    </button>

    <button type="button" class="suggestion" data-ai-suggestion="I want to know product prices">
        I want to know product prices
    </button>

    <button type="button" class="suggestion" data-ai-suggestion="Help me choose a product">
        Help me choose a product
    </button>
</div>

        </section>

        <section
            id="chatMessages"
            class="chat-messages"
            aria-live="polite"
            aria-label="Chat messages"
        ></section>
    </main>

    <form id="aiChatForm" class="message-form">
        <button
            type="button"
            id="aiEmojiButton"
            class="emoji-button"
            aria-label="Choose emoji"
            aria-haspopup="true"
        >
            😊
        </button>

        <textarea
            id="aiChatInput"
            placeholder="Message SEASHOP AI"
            autocomplete="off"
            rows="1"
            aria-label="Message SEASHOP AI"
            required
        ></textarea>

        <button
            type="submit"
            class="send-button"
            aria-label="Send message"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22l-4-9-9-4z"></path>
            </svg>
        </button>
    </form>

    <script src="ai.js" defer></script>
</body>
</html>
